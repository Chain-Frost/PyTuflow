[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pytuflow"
dynamic = ["version"]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.2",
    "packaging>=25.0",
    "dbfread>=2.0.7",
    "pyproj>=3.6.1",
    "h5py>=3.14.0",
    "pyvista>=0.48.2",
    "geopandas>=1.0.1",
    "shapely>=2.0.7",
    "netcdf4>=1.7.2",
    "rasterio>=1.4.3",
    "pygltflib>=1.16.5",
]
requires-python = ">=3.11"
authors = [
    {name = "Ellis Symons", email = "support@tuflow.com"}
]
description = "Official Python library for TUFLOW. A library for working with TUFLOW input and outputs with basic running capabilities."
readme = "README.md"
license-files = ["LICEN[CS]E*"]
keywords = ["tuflow", "hydraulics", "hydraulic modelling", "hydraulic modeling", "flood", "flood modelling", "flood modeling", "flooding", "floodplain", "flood plain", "floodplain modelling", "floodplain modeling", "floodplain management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Other Audience",
    "Topic :: Scientific/Engineering :: Hydrology",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["pytuflow"]
include = [
  "pytuflow/_tmf/tmf/data/*.json",
  "pytuflow/_fm_to_estry/data/*.json",
  "pytuflow/_outputs/data/*.json",
  "pytuflow/project/data/*.json",
  "pytuflow/project/data/templates/**/*",
  "pytuflow/project/data/modules/**/*.json",
  "pytuflow/project/data/empties/**/*.json",
]

[tool.pytest.ini_options]
filterwarnings = [
    'error',
    'ignore:numpy.ndarray size changed',
    'ignore::pytest.PytestUnraisableExceptionWarning'
]

[project.urls]
Homepage = "https://github.com/TUFLOW-Support/PyTuflow"
Documentation = "https://docs.tuflow.com/pytuflow/"
Repository = "https://github.com/TUFLOW-Support/PyTuflow"
Issues = "https://github.com/TUFLOW-Support/PyTuflow/issues"
Changelog = "https://docs.tuflow.com/pytuflow/#changelog"

[project.scripts]
pytuflow-project = "pytuflow.project.__main__:main"

# Ruff checks are scoped to new feature modules; legacy modules are unchanged.
[tool.ruff]
target-version = "py311"
line-length = 120
include = [
    "pytuflow/_tmf/compiled_scope.py",
    "pytuflow/_tmf/deferred_database.py",
    "pytuflow/_tmf/deferred_dependency_fallback.py",
    "pytuflow/_tmf/dependency_records.py",
    "pytuflow/_tmf/effective_dependencies.py",
    "pytuflow/_tmf/file_reference.py",
    "pytuflow/_tmf/fragment_context.py",
    "pytuflow/_tmf/fragment_dependencies.py",
    "pytuflow/_tmf/gpkg_safety.py",
    "pytuflow/batch_validation.py",
    "pytuflow/validation.py",
    "pytuflow/validation_gis.py",
    "pytuflow/validation_links.py",
]

[tool.ruff.lint]
# Core rules adapted from ryan-tools; D adds required API documentation.
select = ["E4", "E7", "E9", "F", "B", "BLE", "I", "UP", "RUF", "D"]
ignore = ["D203", "D213"]
