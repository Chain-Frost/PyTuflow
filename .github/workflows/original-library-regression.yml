name: Curated PR A acceptance
on:
  push:
    branches: ['ci-validation/pr-a-curation-20261028']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    env:
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 97473811b436b5482909fcbd9e316eb37a1999a4
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r harness/ci/requirements-regression.txt
      - run: python harness/ci/curated_acceptance.py --source candidate --output "${{ runner.temp }}/curated-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-windows-${{ matrix.python }}
          path: ${{ runner.temp }}/curated-acceptance
          if-no-files-found: error
          retention-days: 30
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    env:
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 97473811b436b5482909fcbd9e316eb37a1999a4
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r harness/ci/requirements-regression.txt
      - run: python harness/ci/curated_acceptance.py --source candidate --output "${{ runner.temp }}/curated-acceptance" --case-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curated-linux-${{ matrix.python }}
          path: ${{ runner.temp }}/curated-acceptance
          if-no-files-found: error
          retention-days: 30
