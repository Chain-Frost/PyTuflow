name: Original-library staged acceptance
on:
  pull_request:
    branches: [contrib/integration, 'contrib/**', master, ci/resource-efficiency-20261108]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: ['ci-validation/**']
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: original-staged-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      python312_required: ${{ steps.scope.outputs.python312_required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: scope
        run: python ci/pr_gate.py classify --mode full
      - name: Check Python grammar before Windows fan-out
        if: steps.scope.outputs.required == 'true'
        run: python ci/python_compatibility.py
  python311_fast:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.11'
      kind: fast
  python312_fast:
    needs: changes
    if: needs.changes.outputs.required == 'true' && needs.changes.outputs.python312_required == 'true'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.12'
      kind: fast
  python314_fast:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.14'
      kind: fast
  fast_gate:
    name: Fast contracts gate
    if: always()
    needs: [changes, python311_fast, python312_fast, python314_fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require every named interpreter lane
        env:
          REQUIRED: ${{ needs.changes.outputs.required }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON312_REQUIRED: ${{ needs.changes.outputs.python312_required }}
          PR_GATE_TOKEN: ${{ github.token }}
          EXPECTED_JOBS: python311_fast,python312_fast,python314_fast
          JOB_RESULTS: '{"python311_fast": "${{ needs.python311_fast.result }}", "python312_fast": "${{ needs.python312_fast.result }}", "python314_fast": "${{ needs.python314_fast.result }}"}'
        run: python ci/pr_gate.py verify --conditional-python312 --verify-current-pr
  python311_full:
    needs: [changes, fast_gate]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.required == 'true' && needs.fast_gate.result == 'success'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.11'
      kind: full
      run_contracts: false
  python312_full:
    needs: [changes, fast_gate]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.required == 'true' && needs.changes.outputs.python312_required == 'true' && needs.fast_gate.result == 'success'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.12'
      kind: full
      run_contracts: false
  python314_full:
    needs: [changes, fast_gate]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.required == 'true' && needs.fast_gate.result == 'success'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.14'
      kind: full
      run_contracts: false
  gate:
    name: Original library acceptance
    if: always()
    needs: [changes, fast_gate, python311_full, python312_full, python314_full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require every named interpreter lane after successful fast acceptance
        env:
          REQUIRED: ${{ needs.changes.outputs.required }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FAST_GATE_RESULT: ${{ needs.fast_gate.result }}
          PYTHON312_REQUIRED: ${{ needs.changes.outputs.python312_required }}
          PR_GATE_TOKEN: ${{ github.token }}
          EXPECTED_JOBS: python311_full,python312_full,python314_full
          JOB_RESULTS: '{"python311_full": "${{ needs.python311_full.result }}", "python312_full": "${{ needs.python312_full.result }}", "python314_full": "${{ needs.python314_full.result }}"}'
        run: python ci/pr_gate.py verify --require-fast-gate --conditional-python312 --verify-current-pr
