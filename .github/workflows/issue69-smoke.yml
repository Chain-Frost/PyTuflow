name: Issue 69 focused validation (fork only)
on:
  push:
    branches:
      - fix/issue69-materials-conditional-bc
  workflow_dispatch:

jobs:
  focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source and test dependencies
        run: python -m pip install --upgrade pip pytest . 
      - name: Compile Python 3.11-compatible source
        run: python -m compileall -q pytuflow
      - name: Validate selected materials and conditional BC behaviour
        run: python -m pytest -q tests/tmf/test_database.py tests/test_batch_validation_mvp.py tests/test_deferred_database_parity.py tests/test_fragment_inactive_scope.py
