name: PR17 1.3.1 rebase validation (fork only)
on:
  push:
    branches:
      - test/pr17-1.3.1-issue69-matrix
  workflow_dispatch:

jobs:
  focused:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source and test dependencies
        run: python -m pip install --upgrade pip pytest . 
      - name: Compile Python 3.11-compatible source
        run: python -m compileall -q pytuflow
      - name: Validate selected materials and conditional BC behaviour
        run: python -m pytest -q tests/test_batch_validation_mvp.py tests/test_deferred_database_parity.py tests/test_fragment_inactive_scope.py tests/tmf/test_database.py::test_mat_csv_header_after_blank_or_comment_preamble tests/tmf/test_database.py::test_mat_database
      - name: Validate 1.3.1 ARR and consumer integration
        run: python -m pytest -q tests/arr/test_config.py tests/arr/test_writers.py tests/test_bc_event_file_substitutions.py tests/test_tcf_overrides.py tests/test_tcf_projection_warning.py
