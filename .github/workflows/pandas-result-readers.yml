name: Pandas result-reader compatibility
on:
  pull_request:
    branches:
      - contrib/integration
    paths:
      - 'pytuflow/_outputs/catch_json.py'
      - 'pytuflow/_outputs/grid.py'
      - 'pytuflow/_outputs/map_output.py'
      - 'pytuflow/_outputs/mesh.py'
      - 'pytuflow/_outputs/pymesh/mesh_geom/py2dm.py'
      - 'tests/test_pandas31_output_compatibility.py'
      - '.github/workflows/pandas-result-readers.yml'
permissions:
  contents: read
jobs:
  result-reader-compatibility:
    name: Windows Python ${{ matrix.python }} / pandas ${{ matrix.pandas }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
        pandas: ['3.0.3', '3.1.0']
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install matched dependencies
        run: |
          # GeoPandas 1.1.x warns on pandas 3.1 at import. Pin 1.2.0 in both lanes.
          Get-Content ci/requirements-regression.txt |
            Where-Object { $_ -notmatch '^\s*(pandas|geopandas)\s*==' } |
            Set-Content -Encoding utf8 "$env:RUNNER_TEMP/result-reader-requirements.txt"
          python -m pip install -r "$env:RUNNER_TEMP/result-reader-requirements.txt" "geopandas==1.2.0" "pandas==${{ matrix.pandas }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact head, interpreter and dependencies
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/result-reader-compat" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/result-reader-compat/head.txt"
          python -m pip freeze | Set-Content "$env:RUNNER_TEMP/result-reader-compat/dependencies.txt"
          python -c "import sys, pandas, geopandas; print(sys.version); print('pandas', pandas.__version__); print('geopandas', geopandas.__version__); assert pandas.__version__ == '${{ matrix.pandas }}'; assert geopandas.__version__ == '1.2.0'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run strict pandas readers and complete Python mesh suite
        run: |
          python -m pytest -q tests/test_pandas31_output_compatibility.py tests/test_map_output_pymesh.py --junitxml="$env:RUNNER_TEMP/result-reader-compat/tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain raw test and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pandas-readers-py${{ matrix.python }}-pandas-${{ matrix.pandas }}
          path: ${{ runner.temp }}/result-reader-compat/
          if-no-files-found: warn
          retention-days: 30
