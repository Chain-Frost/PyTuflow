name: Native VTK and NumPy compatibility diagnostic
on:
  pull_request:
    paths:
      - 'ci/diagnostics/**'
      - '.github/workflows/native-vtk-numpy-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vtk_numpy:
    name: ${{ matrix.os }} NumPy ${{ matrix.numpy }} VTK ${{ matrix.vtk }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, numpy: '2.4.6', vtk: '9.6.1', expect_shape_deprecation: false}
          - {os: windows-latest, numpy: '2.5.4', vtk: '9.6.1', expect_shape_deprecation: true}
          - {os: windows-latest, numpy: '2.5.4', vtk: '9.6.2', expect_shape_deprecation: true}
          - {os: windows-latest, numpy: '2.5.4', vtk: '9.7.1', expect_shape_deprecation: false}
          - {os: ubuntu-latest, numpy: '2.5.4', vtk: '9.6.1', expect_shape_deprecation: true}
          - {os: ubuntu-latest, numpy: '2.5.4', vtk: '9.7.1', expect_shape_deprecation: false}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact diagnostic pair (no virtual environment)
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: "numpy==${{ matrix.numpy }}" "vtk==${{ matrix.vtk }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute strict VTK-to-NumPy conversion
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic | Out-Null
          $probeArgs = @("ci/diagnostics/vtk_numpy_compat.py")
          if ("${{ matrix.expect_shape_deprecation }}" -eq "true") {
            $probeArgs += "--expect-shape-deprecation"
          }
          python @probeArgs 2>&1 | Tee-Object diagnostic/raw-output.txt
          $status = $LASTEXITCODE
          "diagnostic_exit_code=$status" | Out-File diagnostic/outcome.txt -Encoding utf8
          "expect_shape_deprecation=${{ matrix.expect_shape_deprecation }}" | Out-File diagnostic/outcome.txt -Append -Encoding utf8
          "numpy=${{ matrix.numpy }}" | Out-File diagnostic/versions.txt -Encoding utf8
          "vtk=${{ matrix.vtk }}" | Out-File diagnostic/versions.txt -Append -Encoding utf8
          "os=${{ matrix.os }}" | Out-File diagnostic/versions.txt -Append -Encoding utf8
          if ($status -ne 0) { exit $status }
      - name: Upload raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vtk-numpy-${{ matrix.os }}-np${{ matrix.numpy }}-vtk${{ matrix.vtk }}
          path: diagnostic/
          if-no-files-found: warn

  pyvista_geometry:
    name: ${{ matrix.os }} PyVista ${{ matrix.pyvista }} VTK ${{ matrix.vtk }} NumPy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, numpy: '2.4.6', vtk: '9.6.1', pyvista: '0.48.2'}
          - {os: windows-latest, numpy: '2.5.4', vtk: '9.7.1', pyvista: '0.49.1'}
          - {os: ubuntu-latest, numpy: '2.4.6', vtk: '9.6.1', pyvista: '0.48.2'}
          - {os: ubuntu-latest, numpy: '2.5.4', vtk: '9.7.1', pyvista: '0.49.1'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install exact PyVista / VTK / NumPy combination
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: "numpy==${{ matrix.numpy }}" "vtk==${{ matrix.vtk }}" "pyvista==${{ matrix.pyvista }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Construct PyTuflow-style mixed face mesh and native locator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic | Out-Null
          python ci/diagnostics/pyvista_geometry_compat.py 2>&1 | Tee-Object diagnostic/raw-output.txt
          $status = $LASTEXITCODE
          "diagnostic_exit_code=$status" | Out-File diagnostic/outcome.txt -Encoding utf8
          if ($status -ne 0) { exit $status }
      - name: Upload raw diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyvista-geometry-${{ matrix.os }}-np${{ matrix.numpy }}-vtk${{ matrix.vtk }}-pv${{ matrix.pyvista }}
          path: diagnostic/
          if-no-files-found: warn

  pytuflow_public_readers:
    name: ${{ matrix.os }} PyTuflow reader with PyVista 0.49 VTK 9.7
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing pinned regression dependencies
        shell: pwsh
        run: |
          python -m pip install -r ci/requirements-regression.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install proposed dependency combination and source package
        shell: pwsh
        run: |
          python -m pip install --upgrade "numpy==2.5.4" "vtk==9.7.1" "pyvista==0.49.1" "rasterio==1.5.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise original non-QGIS PyTuflow public mesh readers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic | Out-Null
          python -m pytest -q tests/test_map_output_pymesh.py --junitxml=diagnostic/results.xml 2>&1 | Tee-Object diagnostic/raw-output.txt
          $status = $LASTEXITCODE
          "reader_exit_code=$status" | Out-File diagnostic/outcome.txt -Encoding utf8
          python -m pip freeze | Out-File diagnostic/dependencies.txt -Encoding utf8
          if ($status -ne 0) { exit $status }
      - name: Retain raw reader and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytuflow-reader-geometry-${{ matrix.os }}
          path: diagnostic/
          if-no-files-found: warn
