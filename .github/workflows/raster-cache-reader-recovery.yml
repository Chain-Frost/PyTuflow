name: Raster cache and NetCDF recovery
on:
  pull_request:
    branches:
      - contrib/integration
    paths:
      - 'pytuflow/_outputs/grid.py'
      - 'pytuflow/_outputs/nc_grid.py'
      - 'tests/test_raster_cache_reader_recovery.py'
      - '.github/workflows/raster-cache-reader-recovery.yml'
permissions:
  contents: read
jobs:
  raster-recovery:
    name: Windows Python ${{ matrix.python }} cache/recovery
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.14']
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned regression environment
        run: |
          python -m pip install -r ci/requirements-regression.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record revision and dependencies
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/raster-recovery" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/raster-recovery/head.txt"
          python -m pip freeze | Set-Content "$env:RUNNER_TEMP/raster-recovery/dependencies.txt"
          python -c "import sys,pandas,netCDF4;print(sys.version);print('pandas',pandas.__version__);print('netCDF4',netCDF4.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run strict cache, time, mesh and series tests
        run: |
          python -m pytest -q tests/test_raster_cache_reader_recovery.py tests/test_result_time_correctness.py tests/test_map_output_pymesh.py tests/test_time_series.py --junitxml="$env:RUNNER_TEMP/raster-recovery/tests.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive JUnit and dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-recovery-py${{ matrix.python }}
          path: ${{ runner.temp }}/raster-recovery/
          if-no-files-found: warn
          retention-days: 30
