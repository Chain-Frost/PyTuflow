name: Public API compatibility contracts 08B

on:
  pull_request:
    paths:
      - ".github/workflows/public-api-contracts.yml"
      - "tests/test_public_api_contracts.py"
      - "docs/contributing/PUBLIC_API_COMPATIBILITY.md"
      - "pytuflow/__init__.py"
      - "pytuflow/TUFLOW.py"
      - "pytuflow/_outputs/**"
      - "pytuflow/_tmf/__init__.py"
      - "pytuflow/project/**"
      - "pytuflow/util/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-api:
    name: Public API source/wheel Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source package and test tools
        run: python -m pip install -e . pytest build hatchling
      - name: Check public API in source installation
        run: python -m pytest -q tests/test_public_api_contracts.py
      - name: Build installed-wheel candidate
        run: python -m build --wheel --no-isolation
      - name: Check public API in isolated installed wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -Path "dist/*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Distribution wheel missing" }
          python -m pip uninstall -y pytuflow
          if ($LASTEXITCODE -ne 0) { throw "Failed to uninstall editable source" }
          python -m pip install --no-deps "$wheel"
          if ($LASTEXITCODE -ne 0) { throw "Failed to install wheel" }

          $outside = Join-Path $env:RUNNER_TEMP "pytuflow-08b-api"
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          Copy-Item "tests/test_public_api_contracts.py" (Join-Path $outside "test_public_api_contracts.py")
          Push-Location $outside
          try {
            python -I -c "import pathlib,os,pytuflow; p=pathlib.Path(pytuflow.__file__).absolute(); root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).absolute(); assert not p.is_relative_to(root), p; print('Wheel package origin:',p)"
            if ($LASTEXITCODE -ne 0) { throw "Wheel origin check failed" }
            python -I -m pytest -q test_public_api_contracts.py
            if ($LASTEXITCODE -ne 0) { throw "Installed wheel API tests failed" }
          }
          finally {
            Pop-Location
          }
