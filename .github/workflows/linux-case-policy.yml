name: Linux filename case-policy regression

on:
  pull_request:
    paths:
      - "pytuflow/_tmf/**"
      - "tests/tmf/test_linux_case_policy.py"
      - ".github/workflows/linux-case-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  case-policy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PyTUFLOW and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Filesystem case policy
        run: python -m pytest -q -ra tests/tmf/test_linux_case_policy.py
      - name: Python 3.11 grammar compatibility
        run: python ci/python_compatibility.py
