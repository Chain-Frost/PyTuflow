name: Linux filename case-policy regression

on:
  pull_request:
    paths:
      - "pytuflow/_tmf/**"
      - "tests/test_linux_case_policy.py"
      - ".github/workflows/linux-case-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  case-policy:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # First PR attempt stops early; reruns retain every lane for diagnosis.
      fail-fast: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/linux-case-policy.yml
      - name: Python 3.11 grammar compatibility
        run: python ci/python_compatibility.py
      - name: Install PyTUFLOW and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Filesystem case policy
        run: python -m pytest -q -ra tests/test_linux_case_policy.py
