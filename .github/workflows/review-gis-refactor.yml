name: Review new validation modules

on:
  push:
    branches:
      - contrib/validate-validation-gis-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Focused regression ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install new-feature dependencies
        run: python -m pip install -e . pytest==9.2.0 ruff==0.16.6
      - name: Compile
        run: python -m compileall -q pytuflow
      - name: Test GIS and preflight
        run: >-
          python -m pytest -q
          tests/test_deferred_gis_inspection.py
          tests/test_input_validation.py
          tests/test_batch_validation_mvp.py
          tests/test_gpkg_safety.py
          tests/test_deferred_database_parity.py
          tests/test_fragment_dependencies.py
          tests/test_effective_dependency_manifests.py
  lint:
    name: Ruff audit on new modules (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.6
      - name: Report ryan-tools derived Ruff rules and documentation failures
        shell: bash
        run: |
          python -m ruff check --isolated --target-version py311 --line-length 120 --select E4,E7,E9,F,B,UP,I,RUF,D --output-format concise pytuflow/_tmf/compiled_scope.py pytuflow/_tmf/deferred_database.py pytuflow/_tmf/deferred_dependency_fallback.py pytuflow/_tmf/dependency_records.py pytuflow/_tmf/effective_dependencies.py pytuflow/_tmf/file_reference.py pytuflow/_tmf/fragment_context.py pytuflow/_tmf/fragment_dependencies.py pytuflow/_tmf/gpkg_safety.py pytuflow/batch_validation.py pytuflow/validation.py pytuflow/validation_gis.py pytuflow/validation_links.py || true
