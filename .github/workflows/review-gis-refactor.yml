name: Review new validation modules

on:
  push:
    branches:
      - contrib/validate-validation-gis-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Focused regression ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install new-feature dependencies
        run: python -m pip install -e . pytest==9.2.0 ruff==0.16.6
      - name: Compile
        run: python -m compileall -q pytuflow
      - name: Test GIS and preflight
        run: >-
          python -m pytest -q
          tests/test_deferred_gis_inspection.py
          tests/test_input_validation.py
          tests/test_batch_validation_mvp.py
          tests/test_gpkg_safety.py
          tests/test_deferred_database_parity.py
          tests/test_fragment_dependencies.py
          tests/test_effective_dependency_manifests.py
          tests/tmf/test_input.py::test_input_files_ref_in_gis
          tests/tmf/test_input_context.py::test_input_files_ref_in_gis
  lint:
    name: Ruff rules for new modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.6
      - name: Enforce focused Ruff and documentation rules
        run: python -m ruff check .
