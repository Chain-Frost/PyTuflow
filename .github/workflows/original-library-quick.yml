name: Fast original-library contracts
on:
  pull_request:
    branches: [contrib/integration, 'contrib/**', master]
  push:
    branches: ['ci-validation/**']
permissions:
  contents: read
concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - id: scope
        run: python ci/pr_gate.py classify --mode fast
      - name: Check Python grammar before Windows fan-out
        if: steps.scope.outputs.required == 'true'
        run: python ci/python_compatibility.py
  python311:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.11'
      kind: fast
  python312:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.12'
      kind: fast
  python314:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    uses: ./.github/workflows/original-library-lane.yml
    with:
      python: '3.14'
      kind: fast
  gate:
    name: Fast contracts gate
    if: always()
    needs: [changes, python311, python312, python314]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require every named interpreter lane
        env:
          REQUIRED: ${{ needs.changes.outputs.required }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          EXPECTED_JOBS: python311,python312,python314
          JOB_RESULTS: '{"python311": "${{ needs.python311.result }}", "python312": "${{ needs.python312.result }}", "python314": "${{ needs.python314.result }}"}'
        run: python ci/pr_gate.py verify
