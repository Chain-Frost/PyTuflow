name: Focused public typing 08C

on:
  pull_request:
    paths:
      - ".github/workflows/public-typing-08c.yml"
      - "pytuflow/py.typed"
      - "pytuflow/TUFLOW.pyi"
      - "pytuflow/TUFLOW.py"
      - "pytuflow/__init__.py"
      - "pyproject.toml"
      - "tests/test_legacy_resdata_stub.py"
      - "tests/typing/**"
      - "docs/contributing/PUBLIC_TYPING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-typing:
    name: Public typing installed-wheel Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install configured interpreter dependencies and static tools
        run: python -m pip install -e . pytest build hatchling mypy pyright

      - name: Source and public compatibility regressions
        run: python -m pytest -q tests/test_legacy_resdata_stub.py tests/test_public_api_contracts.py

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --no-isolation

      - name: Verify marker and stub in both distribution archives
        shell: pwsh
        run: |
          python -c "import glob,zipfile,tarfile; w=glob.glob('dist/*.whl'); s=glob.glob('dist/*.tar.gz'); assert len(w)==len(s)==1,(w,s); wn=zipfile.ZipFile(w[0]).namelist(); sn=tarfile.open(s[0]).getnames(); required=('pytuflow/py.typed','pytuflow/TUFLOW.pyi'); assert all(x in wn for x in required),wn; assert all(any(y.endswith('/'+x) for y in sn) for x in required),sn; print('PEP 561 marker and legacy stub included in wheel and sdist')"

      - name: Test separately installed wheel outside checkout
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "dist/*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Distribution wheel not found" }

          python -m pip uninstall -y pytuflow
          if ($LASTEXITCODE -ne 0) { throw "Could not uninstall source package" }
          python -m pip install --no-deps "$wheel"
          if ($LASTEXITCODE -ne 0) { throw "Could not install distribution wheel" }

          $outside = Join-Path $env:RUNNER_TEMP "pytuflow-08c-public-typing"
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          Copy-Item "tests/test_legacy_resdata_stub.py" (Join-Path $outside "test_legacy_resdata_stub.py")
          Copy-Item "tests/typing/*.py" $outside

          Push-Location $outside
          try {
            python -I -c "import os,pathlib,pytuflow; p=pathlib.Path(pytuflow.__file__).absolute(); root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).absolute(); assert not p.is_relative_to(root),p; print('Installed package:',p)"
            if ($LASTEXITCODE -ne 0) { throw "Wheel import origin check failed" }
            python -I -m pytest -q test_legacy_resdata_stub.py
            if ($LASTEXITCODE -ne 0) { throw "Wheel runtime/stub contracts failed" }
            python -I check_static.py
            if ($LASTEXITCODE -ne 0) { throw "Wheel static typing contracts failed" }
          }
          finally {
            Pop-Location
          }
